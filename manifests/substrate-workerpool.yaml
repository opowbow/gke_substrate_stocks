apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: stock-analyst-pool
  namespace: default
  labels:
    workload: stock-analyst
spec:
  replicas: 2
  sandboxClass: gvisor
  workerImage: WORKER_IMAGE_PLACEHOLDER
  template:
    nodeSelector:
      ate.dev/substrate-version: SUBSTRATE_VERSION_PLACEHOLDER
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "1Gi"
