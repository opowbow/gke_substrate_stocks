apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: stock-analyst-pool
  namespace: default
  labels:
    workload: stock-analyst
spec:
  replicas: 2
  sandboxClasses:
    - name: gvisor
  workerImage: ghcr.io/agent-substrate/substrate/ateworker:v1.0.0
  template:
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "1Gi"
