apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: stock-analyst-pool
  namespace: default
  labels:
    workload: stock-analyst
spec:
  replicas: 2
  sandboxClasses:
    - gvisor
  workerImage: ghcr.io/agent-substrate/substrate/ateom-gvisor:v1.0.0
  template:
    nodeSelector:
      ate.dev/substrate-version: v1.0.0
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "1Gi"
