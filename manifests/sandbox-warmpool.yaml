apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: stock-analyst-sandbox-template
  namespace: default
spec:
  podTemplate:
    metadata:
      labels:
        app: stock-analyst-sandbox
    spec:
      runtimeClassName: gvisor
      containers:
      - name: agent
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 8888
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 1
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: stock-analyst-warmpool
  namespace: default
spec:
  replicas: 2
  sandboxTemplateRef:
    name: stock-analyst-sandbox-template
