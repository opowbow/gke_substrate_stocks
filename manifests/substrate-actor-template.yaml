metadata:
  atespace: trading-desk
  name: stock-analyst
workerSelector:
  matchLabels:
    workload: stock-analyst
containers:
- name: agent
  image: IMAGE_PLACEHOLDER
  env:
  - name: PORT
    value: "8080"
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 8080
resources:
  limits:
  - name: cpu
    quantity: "1"
  - name: memory
    quantity: 512Mi
sandboxConfig:
  sandboxClass: SANDBOX_CLASS_GVISOR
  configName: gvisor-default
snapshotConfig:
  onPause: SNAPSHOT_CONTENT_SCOPE_FULL
  onCommit: SNAPSHOT_CONTENT_SCOPE_FULL
  storageLocation: gs://BUCKET_PLACEHOLDER/stock-analyst/
