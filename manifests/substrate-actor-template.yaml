metadata:
  atespace: trading-desk
  name: stock-analyst
workerSelector:
  matchLabels:
    workload: stock-analyst
containers:
- name: agent
  image: IMAGE_DIGEST_PLACEHOLDER
  env:
  - name: PORT
    value: "8080"
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 8080
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 536870912
