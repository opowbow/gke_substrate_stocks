metadata:
  atespace: trading-desk
  name: stock-analyst
workerSelector:
  matchLabels:
    workload: stock-analyst
containers:
- name: agent
  image: us-central1-docker.pkg.dev/op-agents-001/agent-demo/stock-analyst:v1
  env:
  - name: PORT
    value: "8080"
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 8080
resources:
  limits:
  - name: cpu
    quantity: "1"
  - name: memory
    quantity: 512Mi
sandboxConfig:
  sandboxClass: SANDBOX_CLASS_GVISOR
  configName: gvisor-default
snapshotConfig:
  onPause: SNAPSHOT_CONTENT_SCOPE_FULL
  onCommit: SNAPSHOT_CONTENT_SCOPE_FULL
  storageLocation: gs://ate-snapshots-op-agents-001-gke-substrate-001-us-west1-c/stock-analyst/
