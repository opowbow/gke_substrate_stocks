metadata:
  atespace: trading-desk
  name: stock-analyst
workerSelector:
  matchLabels:
    workload: stock-analyst
containers:
- name: agent
  image: us-central1-docker.pkg.dev/op-agents-001/agent-demo/stock-analyst@sha256:cce41b7677060d78277eb38d3c88522db523c988f1c088958afdc8c527ebf162
  env:
  - name: PORT
    value: "8080"
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 8080
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 536870912
