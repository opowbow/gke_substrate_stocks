metadata:
  atespace: trading-desk
  name: stock-analyst
workerSelector:
  matchLabels:
    workload: stock-analyst
containers:
- name: agent
  image: us-central1-docker.pkg.dev/op-agents-001/agent-demo/stock-analyst@sha256:abd8b540adbb4875c8769311ca95f80a52fecf6c21239103c2ce83cc5bde9ad4
  env:
  - name: PORT
    value: "8080"
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 8080
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 536870912
